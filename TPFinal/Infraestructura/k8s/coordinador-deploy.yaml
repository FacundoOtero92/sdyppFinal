apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinador
  template:
    metadata:
      labels:
        app: coordinador
    spec:
      serviceAccountName: default  # ✅ Asegurar que no sea `null`
      containers:
      - name: coordinador
        image: facundootero/coordinador:latest  # ✅ Se actualizará automáticamente
        ports:
        - containerPort: 5000

        # ✅ Se movió correctamente dentro de `containers`
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"


        livenessProbe:  # ✅ Verifica si está vivo, si falla lo reinicia
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15

        readinessProbe:  # ✅ Verifica si está listo para recibir tráfico
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        volumeMounts:
        - name: gcp-credentials
          mountPath: "/app/credentials.json"
          subPath: "credentials.json"

      volumes:
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials  # ✅ Asegurar que esté bien indentado y sin errores

---
apiVersion: v1
kind: Service
metadata:
  name: coordinador-integrador
spec:
  type: LoadBalancer
  selector:
    app: coordinador
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
