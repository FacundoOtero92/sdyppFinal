# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: coordinador-integrador
# spec:
#   type: LoadBalancer
#   selector:
#     app: coordinador
#   ports:
#     - protocol: TCP
#       port: 5000
#       targetPort: 5000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinador
  template:
    metadata:
      labels:
        app: coordinador
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: In
                values:
                - aplicacion
      containers:
      - image: facundootero/coordinador:latest
        livenessProbe:
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        name: coordinador
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - mountPath: /app/credentials.json
          name: gcp-credentials
          subPath: credentials.json
      serviceAccountName: default
      volumes:
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: coordinador-integrador
spec:
  ports:
  - port: 5000
    protocol: TCP
    targetPort: 5000
  selector:
    app: coordinador
  type: LoadBalancer

