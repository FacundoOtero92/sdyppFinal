# 1. promtail-config.yaml (lector de logs de pods para Loki)
server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: worker-logs
    static_configs:
      - targets: ['localhost']
        labels:
          job: worker
          __path__: /var/log/worker/*.log

  - job_name: coordinator-logs
    static_configs:
      - targets: ['localhost']
        labels:
          job: coordinator
          __path__: /var/log/coordinator/*.log