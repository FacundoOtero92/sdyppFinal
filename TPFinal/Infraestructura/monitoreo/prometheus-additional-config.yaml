additionalScrapeConfigs:
scrape_configs:
  - job_name: 'coordinador'
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace]
        action: keep
        regex: coordinador-integrador;default


  # - job_name: 'worker'
  #   static_configs:
  #     - targets: ['worker-cpu:8010']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
