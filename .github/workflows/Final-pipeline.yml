    - name: Instalar gke-gcloud-auth-plugin manualmente
      run: |
          export CLOUD_SDK_REPO="cloud-sdk"
          echo "deb http://packages.cloud.google.com/apt $CLOUD_SDK_REPO main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

    - name: Obtener credenciales de GKE
      run: |
          gcloud container clusters get-credentials cluster-integrador --zone us-east1-c --project sdyppfinal2025
          kubectl get nodes

    - name: Aplicar Deployment de RabbitMQ en Kubernetes
      run: |
          kubectl apply --validate=false -f TPFinal/Infraestructura/k8s/rabbit-deploy.yaml

    - name: Aplicar Deployment de Redis en Kubernetes
      run: |
              kubectl apply --validate=false -f TPFinal/Infraestructura/k8s/redis-deploy.yaml
    
    - name: Verificar estado de Redis
      run: |
              kubectl get pods
              kubectl get services redis-integrador
    
    
    - name: Apply Kubernetes Deployment (Coordinador)
      run: |
                kubectl apply -f TPFinal/Infraestructura/k8s/coordinador-deploy.yaml
                kubectl rollout restart deployment coordinador  # Reiniciar el despliegue para tomar la nueva imagen
            
        

    - name: Obtener IP pública del Coordinador
      run: |
                  echo "Esperando a que se asigne la IP pública al Coordinador..."
                  for i in {1..10}; do
                      IP=$(kubectl get service coordinador-integrador -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                      if [[ -n "$IP" ]]; then
                          echo "IP pública del Coordinador: $IP"
                          echo "COORDINADOR_IP=$IP" >> $GITHUB_ENV
                          break
                      fi
                      echo " Aún no se asignó la IP, reintentando en 10 segundos..."
                      sleep 10
                  done
                   