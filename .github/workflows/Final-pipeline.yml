name: Terraform and Kubernetes Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'



    - name: Authenticate with Google Cloud
      run: |
              echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > ${{ github.workspace }}/gcloud-key.json
              gcloud auth activate-service-account --key-file=${{ github.workspace }}/gcloud-key.json
  
    - name: Configurar el proyecto en Google Cloud
      run: |
                gcloud config set project sdyppfinal2025
                gcloud config set compute/zone us-east1-c
                gcloud config set compute/region us-east1

    - name: Instalar gke-gcloud-auth-plugin manualmente
      run: |
                    echo "🔹 Instalando gke-gcloud-auth-plugin..."
                    export CLOUD_SDK_REPO="cloud-sdk"
                    echo "deb http://packages.cloud.google.com/apt $CLOUD_SDK_REPO main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
                    curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add -
                    sudo apt-get update && sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin
                    echo "✅ Plugin instalado correctamente."
          
         
    - name: Configurar kubectl con credenciales de GKE
      run: |
                        echo "🔹 Obteniendo credenciales del clúster de GKE..."
                        gcloud container clusters get-credentials cluster-integrador --zone us-east1-c --project sdyppfinal2025
                        kubectl config current-context
              
      
    - name: Asignar permisos a la cuenta predeterminada de Compute Engine
      run: |
                            COMPUTE_SA="105059060773-compute@developer.gserviceaccount.com"
                            
                            echo "🛠️ Asignando permisos de storage.objectAdmin a $COMPUTE_SA..."
                            gcloud storage buckets add-iam-policy-binding gs://bucket_integrador_final2025 \
                              --member="serviceAccount:$COMPUTE_SA" \
                              --role="roles/storage.objectAdmin"
                  
                            echo "🛠️ Asignando permisos de storage.admin a $COMPUTE_SA..."
                            gcloud projects add-iam-policy-binding sdyppfinal2025 \
                              --member="serviceAccount:$COMPUTE_SA" \
                              --role="roles/storage.admin"
                  
                            echo "✅ Permisos asignados correctamente a $COMPUTE_SA."
                  
                  








    - name: Install dependencies (Coordinador)
      run: |
        python -m pip install --upgrade pip
        pip install -r TPFinal/blockchain/Coordinador/requirements.txt

     # Verificar archivos en la carpeta Minero
    - name: List files in Minero
      run: |
       ls TPFinal/blockchain/Minero

   # Instalar dependencias en la carpeta Minero
    - name: Install dependencies (Minero)
      run: |
       python -m pip install --upgrade pip
       pip install -r TPFinal/blockchain/Minero/requirements.txt

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Authenticate with Google Cloud (Coordinador)
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_COORDINADOR }}
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS_COORDINADOR }}' > credentials.json
   

  



        



     # Setup de CLI de Terraform
    - name: Terraform setup
      uses: hashicorp/setup-terraform@v3
    
    - name: Verificar y crear bucket en GCS si no existe
      run: |
          BUCKET_NAME="bucket_integrador_final2025"
          PROJECT_ID="sdyppfinal2025"
          REGION="us-east1"

          if ! gsutil ls -b gs://$BUCKET_NAME 2>/dev/null; then
            echo "El bucket no existe, creando..."
            gsutil mb -p $PROJECT_ID -c STANDARD -l $REGION gs://$BUCKET_NAME
          else
            echo "El bucket ya existe."
          fi


    - name: Terraform init
      working-directory: "TPFinal/Infraestructura/terraform servicios"
      env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
      run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > credentials.json
    
          ls -lah

            BUCKET_NAME="bucket_integrador_final2025"
            PREFIX="cluster/state"

            terraform init --reconfigure \
              --backend-config "bucket=${BUCKET_NAME}" \
              --backend-config "prefix=${PREFIX}"
            
            terraform import google_compute_network.main projects/sdyppfinal2025/global/networks/main || true
            terraform import google_compute_address.nat projects/sdyppfinal2025/regions/us-east1/addresses/nat || true
            terraform import google_compute_firewall.allow-ssh projects/sdyppfinal2025/global/firewalls/allow-ssh || true
            terraform import google_service_account.kubernetes projects/sdyppfinal2025/serviceAccounts/kubernetes@sdyppfinal2025.iam.gserviceaccount.com || true
           
            terraform validate

            terraform plan -lock=false

            terraform apply -lock=false --auto-approve
      continue-on-error: true
      # - name: Initialize Terraform
      # working-directory: "TPFinal/Infraestructura/terraform servicios"
