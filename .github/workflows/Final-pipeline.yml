name: Terraform and Kubernetes Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies (Coordinador)
      run: |
        python -m pip install --upgrade pip
        pip install -r TPFinal/blockchain/Coordinador/requirements.txt

     # Verificar archivos en la carpeta Minero
    - name: List files in Minero
      run: |
       ls TPFinal/blockchain/Minero

   # Instalar dependencias en la carpeta Minero
    - name: Install dependencies (Minero)
      run: |
       python -m pip install --upgrade pip
       pip install -r TPFinal/blockchain/Minero/requirements.txt

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Authenticate with Google Cloud (Coordinador)
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_COORDINADOR }}
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS_COORDINADOR }}' > credentials.json
   

    - name: Authenticate with Google Cloud (Minero)
     
      env:
         GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_MINERO }}
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS_MINERO }}' > credentials.json
    






    - name: Asignar permisos en GCP
      run: |
          gcloud projects add-iam-policy-binding sdyppfinal2025 \
            --member="serviceAccount:kubernetes@sdyppfinal2025.iam.gserviceaccount.com" \
            --role="roles/owner"
  
          gcloud projects add-iam-policy-binding sdyppfinal2025 \
            --member="serviceAccount:kubernetes@sdyppfinal2025.iam.gserviceaccount.com" \
            --role="roles/editor"
  
          gcloud projects add-iam-policy-binding sdyppfinal2025 \
            --member="serviceAccount:kubernetes@sdyppfinal2025.iam.gserviceaccount.com" \
            --role="roles/compute.admin"
  
          gcloud projects add-iam-policy-binding sdyppfinal2025 \
            --member="serviceAccount:kubernetes@sdyppfinal2025.iam.gserviceaccount.com" \
            --role="roles/iam.serviceAccountAdmin"
  
          gcloud projects add-iam-policy-binding sdyppfinal2025 \
            --member="serviceAccount:kubernetes@sdyppfinal2025.iam.gserviceaccount.com" \
            --role="roles/iam.serviceAccountUser"
  
          gcloud projects add-iam-policy-binding sdyppfinal2025 \
            --member="serviceAccount:kubernetes@sdyppfinal2025.iam.gserviceaccount.com" \
            --role="roles/serviceusage.serviceUsageAdmin"
  
    - name: Verificar permisos de la cuenta de servicio
      run: |
          gcloud projects get-iam-policy sdyppfinal2025 --flatten="bindings[].members" --format="table(bindings.role)"
  




        



     # Setup de CLI de Terraform
    - name: Terraform setup
      uses: hashicorp/setup-terraform@v3
    
    - name: Terraform init
      working-directory: "TPFinal/Infraestructura/terraform servicios"
      env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
      run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > credentials.json
    
          ls -lah

            BUCKET_NAME="terraform_state_cloud"
            PREFIX="cluster/state"

            terraform init --reconfigure \
              --backend-config "bucket=${BUCKET_NAME}" \
              --backend-config "prefix=${PREFIX}"
            
            terraform import google_compute_network.main projects/sdyppfinal2025/global/networks/main || true
            terraform import google_compute_address.nat projects/sdyppfinal2025/regions/us-east1/addresses/nat || true
            terraform import google_compute_firewall.allow-ssh projects/sdyppfinal2025/global/firewalls/allow-ssh || true
            terraform import google_service_account.kubernetes projects/sdyppfinal2025/serviceAccounts/kubernetes@sdyppfinal2025.iam.gserviceaccount.com || true
           
            terraform validate

            terraform plan -lock=false

            terraform apply -lock=false --auto-approve
      continue-on-error: true
      # - name: Initialize Terraform
      # working-directory: "TPFinal/Infraestructura/terraform servicios"
      # run: terraform init
      
    # - name: Plan Terraform changes
    #   working-directory: "TPFinal/Infraestructura/terraform servicios"
    #   run: terraform plan

    # - name: Apply Terraform changes
    #   if: github.ref == 'refs/heads/main'
    #   working-directory: "TPFinal/Infraestructura/terraform servicios"
    #   run: terraform apply -auto-approve
   


    - name: Build Docker Images (Coordinador)
      run: |
        docker build -f TPFinal/blockchain/Coordinador/dockerfile.dockerfile -t coordinador-app TPFinal/blockchain/Coordinador


    - name: Build Docker Images (Minero)
      run: |
          docker build -f TPFinal/blockchain/Minero/worker_cpu.dockerfile -t worker-cpu-app TPFinal/blockchain/Minero
    # docker build -f TPFinal/blockchain/Minero/worker_gpu.dockerfile -t worker-gpu-app TPFinal/blockchain/Minero
      
    # - name: Authenticate with Google Cloud
    #   env:
    #         GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
    #   run: |
    #         echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > credentials.json
    
    # Configuración de kubectl para interactuar con el clúster de GKE
    # - name: Authenticate with Google Cloud
    #   run: |
    #     echo "${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}" > ${{ github.workspace }}/gcloud-key.json
    #     gcloud auth activate-service-account --key-file=${{ github.workspace }}/gcloud-key.json
    #     gcloud config set project sdypp2025
    #     gcloud config set compute/zone us-east1-c
    #     gcloud config set compute/region us-east1
    - name: Authenticate with Google Cloud
      run: |
            echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > ${{ github.workspace }}/gcloud-key.json
            gcloud auth activate-service-account --key-file=${{ github.workspace }}/gcloud-key.json

    - name: Configurar el proyecto en Google Cloud
      run: |
              gcloud config set project sdyppfinal2025
              gcloud config set compute/zone us-east1-c
              gcloud config set compute/region us-east1
   
              
  
  #  # Despliegue de RabbitMQ en Kubernetes
  #   - name: Deploy RabbitMQ to Kubernetes
  #     run: |
  #           kubectl apply -f TPFinal/Infraestructura/k8s/rabbit-deploy.yaml
  # #  # Verificación de que RabbitMQ está corriendo y tiene IP pública
  # #   - name: Verify RabbitMQ Service
  # #     run: |
  # #           kubectl get services rabbitmq
  #   - name: Verificar estado de RabbitMQ
  #     run: |
  #       kubectl get pods
  #       kubectl get services rabbitmq
    
    - name: Instalar gke-gcloud-auth-plugin
      run: |
        sudo apt-get update && sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

    - name: Obtener credenciales de GKE y verificar acceso
      run: |
        gcloud container clusters get-credentials cluster-integrador --zone us-east1-c --project sdyppfinal2025
        for i in {1..10}; do
          kubectl get nodes && break
          echo "Esperando que los nodos estén disponibles..."
          sleep 10
        done

    - name: Verificar conexión con Kubernetes y nodos
      run: |
        for i in {1..10}; do
          kubectl cluster-info && kubectl get nodes && break
          echo "Esperando que Kubernetes esté disponible..."
          sleep 10
        done

    - name: Aplicar Deployment de RabbitMQ en Kubernetes
      run: |
        kubectl apply --validate=false -f TPFinal/Infraestructura/k8s/rabbit-deploy.yaml

    - name: Esperar a que los pods de RabbitMQ se inicien
      run: |
        for i in {1..10}; do
          kubectl get pods | grep "rabbitmq" && break
          echo "Esperando que los pods de RabbitMQ se inicien..."
          sleep 10
        done

    - name: Verificar estado de RabbitMQ
      run: |
        kubectl get deployments
        kubectl get pods
        kubectl get services rabbitmq
